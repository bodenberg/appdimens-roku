name: ci
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm install --no-audit --no-fund
      - name: generated token methods are up to date
        run: python3 tools/gen_tokens.py --check
      - name: BrighterScript validation (library + SceneGraph example)
        run: npx bsc --project bsconfig.json
      - name: tests in brs-engine (parity vectors, tokens, modes, custom fixture, SceneGraph example)
        run: npm test
      - name: sideload packages
        run: |
          sh tools/build_example.sh hello
          (cd build/tests-channel && zip -qr ../appdimens-roku-tests.zip .)
      - uses: actions/upload-artifact@v4
        with:
          name: roku-packages
          path: |
            build/hello.zip
            build/appdimens-roku-tests.zip
